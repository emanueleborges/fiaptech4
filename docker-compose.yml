version: "3.8"

services:
  # API Flask com LSTM
  lstm-api:
    build: .
    container_name: fiap-lstm-api
    ports:
      - "5000:5000"
    volumes:
      # Persistir modelos treinados
      - ./models:/app/models
      # Persistir banco de dados
      - ./instance:/app/instance
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Interface Gradio (opcional)
  gradio-ui:
    build: .
    container_name: fiap-gradio-ui
    command: python interface_lstm.py
    ports:
      - "7860:7860"
    volumes:
      - ./models:/app/models
      - ./instance:/app/instance
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - lstm-api
    restart: unless-stopped

  # Prometheus para monitoramento
  prometheus:
    image: prom/prometheus:latest
    container_name: fiap-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"

  # Grafana para visualização
  grafana:
    image: grafana/grafana:latest
    container_name: fiap-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  models:
    driver: local
  instance:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  default:
    name: fiap-tech-challenge
